<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0D0D" />
    <meta
      name="description"
      content="Portfolio of Jasman Sidhu, a CS student at Oakland University building practical AI products."
    />
    <title>Jasman Sidhu - Portfolio</title>
    <!-- Dark from the very first frame (the stylesheet arrives later), and never restore an old scroll position:
         every visit starts at the top with the loader. -->
    <meta name="color-scheme" content="dark" />
    <style>
      html,
      body {
        background: #0a0a0a;
      }
    </style>
    <script>
      history.scrollRestoration = 'manual'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
