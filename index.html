<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Jasman Sidhu</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0a0b0c;
      color: #edefea;
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      display: grid;
      place-items: center;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: #c8ff2e; color: #0a0b0c; }
    main { text-align: center; padding: 1.5rem; }
    .label {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #0a0b0c;
      background: #c8ff2e;
      padding: 0.4rem 0.75rem;
      margin-bottom: 1.75rem;
    }
    h1 {
      font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      font-size: clamp(2rem, 7vw, 4.5rem);
      line-height: 1.05;
      margin-bottom: 1.25rem;
    }
    p {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(237, 239, 234, 0.55);
    }
  </style>
</head>
<body>
  <main>
    <span class="label">Under construction</span>
    <h1>Jasman Sidhu</h1>
    <p>This site is getting a rebuild. Check back soon.</p>
  </main>
</body>
</html>
